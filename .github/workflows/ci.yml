name: build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build -c Release
      - name: Tests
        run: dotnet run --project tests/StarCadence.Tests -c Release --no-build
      - name: Tests under other languages' number and date formats (decimal comma, Thai calendar, Turkish i)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for culture in pt-PT de-DE th-TH tr-TR; do
            STARCADENCE_TEST_CULTURE=$culture dotnet run --project tests/StarCadence.Tests -c Release --no-build | tail -1
          done
      - name: Plan the example night (command line)
        shell: bash
        run: |
          dotnet run --project src/StarCadence.Cli -c Release --no-build -- plan --config examples/config.json --date 2026-12-03 --out ci-out --formats txt,json,csv,ekos,nina
          test -s ci-out/plan.txt && test -s ci-out/ekos/plan.esl && test -s ci-out/nina-target-scheduler.csv
      - name: Start the app window (no browser) and use it
        shell: bash
        run: |
          mkdir -p ci-app && cp examples/config.json examples/sample-targets.csv examples/sample-exoclock.json ci-app/
          dotnet run --project src/StarCadence.Cli -c Release --no-build -- app --data ci-app --port 8799 --no-browser > app.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8799/api/ping && break; sleep 2; done
          TOKEN=$(curl -s http://127.0.0.1:8799/ | grep -o '[0-9A-F]\{32\}' | head -1)
          curl -sf http://127.0.0.1:8799/api/state > state.json
          curl -sf -H "X-StarCadence: $TOKEN" -H 'Content-Type: application/json' -X POST http://127.0.0.1:8799/api/plan -d '{"date":"2026-12-03"}' > plan.json
          grep -q '"blocks"' plan.json
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8799/api/plan -d '{}')" = "403"
          curl -sf -o nina.csv "http://127.0.0.1:8799/api/file?path=plans/2026-12-03/nina-target-scheduler.csv" && head -1 nina.csv
          curl -sf -H "X-StarCadence: $TOKEN" -X POST http://127.0.0.1:8799/api/quit
          sleep 2; cat app.log
      - name: Test the app window in a real browser
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pip install --quiet playwright && python -m playwright install --with-deps chromium > /dev/null
          rm -rf ci-ui && mkdir ci-ui && cp examples/config.json examples/sample-targets.csv examples/sample-exoclock.json ci-ui/
          dotnet run --project src/StarCadence.Cli -c Release --no-build -- app --data ci-ui --port 8798 --no-browser > ui.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8798/api/ping && break; sleep 2; done
          python tests/ui/app_ui_test.py http://127.0.0.1:8798/
      - name: Run a night against a real INDI server (simulated mount, filter wheel and camera)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq indi-bin > /dev/null
          indiserver -p 7624 indi_simulator_telescope indi_simulator_ccd indi_simulator_wheel > indiserver.log 2>&1 &
          sleep 3
          STARCADENCE_INDI=localhost:7624 dotnet run --project tests/StarCadence.Tests -c Release --no-build -- RealIndi
          mkdir -p ci-indi && cp examples/config.json examples/sample-targets.csv examples/sample-exoclock.json ci-indi/
          timeout 120 dotnet run --project src/StarCadence.Cli -c Release --no-build -- run --config ci-indi/config.json --simulate --from 2026-12-04T02:00:00Z --speed 3000 | tail -5
      - name: Rehearse a night without hardware (simulation, every system)
        shell: bash
        run: |
          mkdir -p ci-sim && cp examples/config.json examples/sample-targets.csv examples/sample-exoclock.json ci-sim/
          dotnet run --project src/StarCadence.Cli -c Release --no-build -- run --config ci-sim/config.json --simulate --from 2026-12-04T02:00:00Z --speed 6000 > sim.log 2>&1 || true
          grep -q "done (" sim.log && grep -q "Run ended" sim.log
          tail -3 sim.log

  nina:
    name: N.I.N.A. plug-in (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build the plug-in against N.I.N.A.'s plug-in library
        run: dotnet build src/StarCadence.Nina -c Release
      - name: Fetch N.I.N.A.'s native astronomy files for the tests (NOVAS, SOFA, JPL ephemeris; a real N.I.N.A. install has them)
        shell: bash
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/tcpalmer/nina.plugin.targetscheduler ts-external
          git -C ts-external sparse-checkout set NINA.Plugin.TargetScheduler.Test/External
          cp -r ts-external/NINA.Plugin.TargetScheduler.Test/External tests/StarCadence.Nina.Tests/External
          ls -R tests/StarCadence.Nina.Tests/External | head -20
      - name: Check it the way N.I.N.A.'s plug-in loader will, then run nights inside N.I.N.A.'s sequencer
        run: dotnet run --project tests/StarCadence.Nina.Tests -c Release
      - name: Package the plug-in and make its manifest with N.I.N.A.'s own tool
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/isbeorn/nina.plugin.manifests manifests
          # Only our two files: N.I.N.A. provides everything else. They sit at the top of the zip, which is how
          # N.I.N.A.'s installer unpacks an archive plug-in (into Plugins\3.0.0\<name>\).
          $stage = New-Item -ItemType Directory -Force stage/StarCadence
          $out = "src/StarCadence.Nina/bin/Release/net8.0-windows7.0"
          Copy-Item "$out/StarCadence.Nina.dll", "$out/StarCadence.Core.dll" $stage
          Copy-Item src/StarCadence.Nina/README-NINA.md (Join-Path $stage README.md)
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { 'latest' }
          & manifests/tools/CreateManifest.ps1 -file (Join-Path $stage StarCadence.Nina.dll) -createArchive -includeAll -archiveName StarCadence-nina-plugin `
            -installerUrl "https://github.com/TechAmatuer/StarCadence/releases/download/$tag/StarCadence-nina-plugin.zip"
          if (-not (Test-Path manifest.json)) { throw "manifest.json was not written" }
          $m = Get-Content manifest.json -Raw | ConvertFrom-Json
          $hash = (Get-FileHash StarCadence-nina-plugin.zip -Algorithm SHA256).Hash
          if ($m.Installer.Type -ne 'ARCHIVE' -or $m.Installer.Checksum -ne $hash) { throw "manifest does not describe the zip: $($m.Installer | ConvertTo-Json)" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $names = [IO.Compression.ZipFile]::OpenRead((Resolve-Path StarCadence-nina-plugin.zip)).Entries.FullName
          "zip: $($names -join ', ')"
          if (-not ($names -contains 'StarCadence.Nina.dll' -and $names -contains 'StarCadence.Core.dll')) { throw "the plug-in files must be at the top of the zip" }
          "manifest: $($m.Name) $($m.Version.Major).$($m.Version.Minor).$($m.Version.Patch) $($m.Installer.Type) $($m.Installer.URL)"
          Copy-Item manifest.json StarCadence-nina-manifest.json
      - name: Validate the manifest against N.I.N.A.'s schema
        shell: bash
        run: |
          cd manifests && npm install --silent > /dev/null 2>&1 || npm install
          node -e "
            const Ajv=require('ajv'); const addFormats=require('ajv-formats'); const ajv=new Ajv(); addFormats(ajv);
            const v=ajv.compile(require('./manifest.schema.json')); const m=JSON.parse(require('fs').readFileSync('../manifest.json','utf8').replace(/^\uFEFF/,''));
            if(!v(m)){ console.error(JSON.stringify(v.errors,null,1)); process.exit(1);} console.log('manifest is valid: '+m.Name+' '+Object.values(m.Version).join('.'));"
      - uses: actions/upload-artifact@v4
        with:
          name: StarCadence-nina-plugin
          path: |
            StarCadence-nina-plugin.zip
            StarCadence-nina-manifest.json

  package:
    name: package (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, rid: win-x64, os: windows-latest }
          - { name: mac, rid: osx-arm64, os: macos-latest }
          - { name: linux, rid: linux-x64, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish a self-contained program (no .NET needed to run it)
        run: dotnet publish src/StarCadence.Cli -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist/bin
      - name: Smoke test the program
        shell: bash
        run: |
          dist/bin/starcadence version
          dist/bin/starcadence plan --config examples/config.json --date 2026-12-03 --out smoke --formats txt
      - name: Open the packaged app window and use it (as a double-click would, minus the browser)
        shell: bash
        run: |
          mkdir -p smoke-app && cp examples/config.json examples/sample-targets.csv examples/sample-exoclock.json smoke-app/
          dist/bin/starcadence app --data smoke-app --port 8797 --no-browser > app.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8797/api/ping && break; sleep 1; done; echo
          curl -sf http://127.0.0.1:8797/ > page.html
          grep -q 'id="support"' page.html
          TOKEN=$(grep -o '[0-9A-F]\{32\}' page.html | head -1)
          curl -sf -H "X-StarCadence: $TOKEN" -H 'Content-Type: application/json' -X POST http://127.0.0.1:8797/api/plan -d '{"date":"2026-12-03"}' -o plan.json
          grep -q '"blocks"' plan.json
          curl -sf -H "X-StarCadence: $TOKEN" -H 'Content-Type: application/json' -X POST http://127.0.0.1:8797/api/run/start -d '{"mode":"simulate","speed":600}' > /dev/null
          sleep 5
          curl -sf http://127.0.0.1:8797/api/run/status -o status.json
          grep -q '"running": true' status.json
          curl -sf -H "X-StarCadence: $TOKEN" -X POST http://127.0.0.1:8797/api/run/stop > /dev/null
          curl -sf -H "X-StarCadence: $TOKEN" -X POST http://127.0.0.1:8797/api/quit
          sleep 3; cat app.log
          grep -q "StarCadence stopped" app.log
      - name: Windows file details (what Explorer and Task Manager show)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $v = (Get-Item dist/bin/starcadence.exe).VersionInfo
          "$($v.ProductName) | $($v.FileDescription) | $($v.FileVersion) | $($v.CompanyName)"
          $want = (Select-Xml -Path Directory.Build.props -XPath '//Version').Node.InnerText
          if ($v.ProductName -ne 'StarCadence' -or $v.FileDescription -ne 'StarCadence' -or -not "$($v.FileVersion)".StartsWith($want)) { "::warning::StarCadence.exe file details are not as expected (version $want)" }
      - name: Windows folder
        if: matrix.name == 'windows'
        shell: bash
        run: |
          mkdir -p "pkg/StarCadence"
          cp dist/bin/starcadence.exe "pkg/StarCadence/StarCadence.exe"
          cp -r examples README.md LICENSE.txt NOTICE.md "pkg/StarCadence/"
          cd pkg && 7z a -tzip ../StarCadence-windows.zip StarCadence > /dev/null
      - name: Mac app (StarCadence.app)
        if: matrix.name == 'mac'
        shell: bash
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          APP=pkg/StarCadence/StarCadence.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp dist/bin/starcadence "$APP/Contents/MacOS/starcadence"
          cp assets/starcadence.icns "$APP/Contents/Resources/StarCadence.icns"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>StarCadence</string>
            <key>CFBundleDisplayName</key><string>StarCadence</string>
            <key>CFBundleIdentifier</key><string>io.github.techamatuer.starcadence</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleExecutable</key><string>starcadence</string>
            <key>CFBundleIconFile</key><string>StarCadence</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>LSUIElement</key><true/>
            <key>NSHumanReadableCopyright</key><string>MPL-2.0</string>
          </dict></plist>
          EOF
          plutil -lint "$APP/Contents/Info.plist"
          codesign --force --deep -s - "$APP"
          cp -r examples README.md LICENSE.txt NOTICE.md pkg/StarCadence/
          cd pkg && ditto -c -k --sequesterRsrc --keepParent StarCadence ../StarCadence-mac.zip
      - name: Linux folder
        if: matrix.name == 'linux'
        shell: bash
        run: |
          mkdir -p pkg/StarCadence && cp dist/bin/starcadence pkg/StarCadence/ && cp -r examples README.md LICENSE.txt NOTICE.md pkg/StarCadence/
          tar -czf StarCadence-linux.tar.gz -C pkg StarCadence
      - uses: actions/upload-artifact@v4
        with:
          name: StarCadence-${{ matrix.name }}
          path: StarCadence-${{ matrix.name }}.*

  release:
    name: attach downloads to the release
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    needs: [package, nina]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Upload the downloads (Windows, Mac, Linux, N.I.N.A. plug-in)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          ls -la out
          # Release notes from docs/releases/<tag>.md when there is one.
          gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/docs/releases/$TAG.md?ref=$GITHUB_SHA" > notes.md 2>/dev/null && [ -s notes.md ] \
            || echo "See the README for download and first-launch steps." > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Published by hand with no description: fill in the notes.
            [ -n "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)" ] || gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "StarCadence $TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
